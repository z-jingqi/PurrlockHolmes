<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="福尔猫斯实时物理试玩：点走桌子，再收起落地的餐具。">
<title>撤桌试验 · 福尔猫斯</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7eedf}
#canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#f7eedf;color:#51382f;font:16px system-ui,sans-serif}
.card{width:min(100%,400px);padding:30px;border:1px solid #e0c9ad;border-radius:20px;background:#fff9ef;text-align:center}
small{letter-spacing:.16em;color:#826149}
h1{margin:8px 0 12px;font-size:28px}
p{line-height:1.55}
progress{width:100%;accent-color:#ad7057}
a{color:#774a35;margin:0 8px}
</style>
</head>
<body>
<canvas id="canvas" aria-label="撤桌试验。点走桌子，再收起落地的餐具。"></canvas>
<div id="loading"><div class="card"><small>PURRLOCK HOLMES</small><h1>撤桌试验</h1>
<p id="status" role="status">正在载入物理试玩…</p><progress id="progress" aria-label="加载进度"></progress>
<p><a href="/">回到找物试玩</a><a href="/physics/replay/">看回放</a></p></div></div>
<noscript>开启 JavaScript 后才能游玩。<a href="/physics/replay/">看回放</a></noscript>
<script src="$GODOT_URL"></script>
<script>
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const engine = new Engine($GODOT_CONFIG);
const fail = (error) => {
  console.error(error);
  status.textContent = "启动失败。请刷新，或用支持 WebGL 2 的浏览器打开。";
  progress.remove();
};
const missing = Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
if (missing.length) fail(missing.join(", "));
else engine.startGame({onProgress(current, total) {
  if (total > 0) { progress.max = total; progress.value = current; }
}}).then(() => document.getElementById("loading").remove(), fail);
</script>
</body>
</html>
