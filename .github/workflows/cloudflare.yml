name: Cloudflare demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
env:
  GODOT_VERSION: 4.7.2
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check web/worker.mjs
      - name: Fetch official Godot Web toolchain
        run: |
          mkdir -p /tmp/purrlock-godot
          curl -fsSL --retry 2 "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64" -o /tmp/purrlock-godot/godot.zip
          unzip -q /tmp/purrlock-godot/godot.zip -d /tmp/purrlock-godot
          python3 tools/fetch-godot-web-template.py "$GODOT_VERSION" /tmp/purrlock-godot/web.zip
      - name: Export and test the Godot game
        run: |
          GODOT="/tmp/purrlock-godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" GODOT_WEB_TEMPLATE=/tmp/purrlock-godot/web.zip sh tools/build-web.sh
          node tools/test-worker.mjs
          "/tmp/purrlock-godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --import
          for order in table,chair,cabinet table,cabinet,chair chair,table,cabinet chair,cabinet,table cabinet,chair,table cabinet,table,chair; do
            "/tmp/purrlock-godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . -- --test-furniture --order="$order"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          path: dist
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set the CLOUDFLARE_ACCOUNT_ID repository variable."; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-build
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
